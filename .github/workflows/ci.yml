name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        # funasr 为懒加载导入（asr_funasr.py 延迟 import，未安装时 pipeline 降级捕获），
        # 测试用例不触发 ASR，CI 跳过它以避免连带拉取数 GB 的 torch
        run: |
          grep -v '^funasr' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt

      - name: 运行测试
        run: python -m pytest tests -q
